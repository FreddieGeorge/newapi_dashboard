server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/newapi-dashboard;
    index index.html;

    charset utf-8;
    autoindex off;

    # Remove these two lines if authentication is not required.
    auth_basic "New API Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/data/.*\.json$ {
        default_type application/json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/data/.*\.csv$ {
        default_type text/csv;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
